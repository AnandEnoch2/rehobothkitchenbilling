kind = "mobile"
previewPath = "/"
title = "Rehoboth Kitchen Billing"
version = "1.0.0"
id = "artifacts/billing-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19849

[services.development]
run = "pnpm --filter @workspace/billing-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/billing-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/billing-app", "run", "serve" ]

[services.env]
PORT = "19849"
BASE_PATH = "/"
